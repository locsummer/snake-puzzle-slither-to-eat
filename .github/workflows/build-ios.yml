name: Build iOS IPA (Sideloadly Ready)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build and Archive
        run: |
          cd ios
          xcodebuild -project SnakePuzzle.xcodeproj \
            -scheme SnakePuzzle \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive -archivePath build/SnakePuzzle.xcarchive

      - name: Package into IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/SnakePuzzle.xcarchive/Products/Applications/SnakePuzzle.app Payload/
          zip -r -9 ../SnakePuzzle.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakePuzzle-iOS-IPA
          path: SnakePuzzle.ipa
          if-no-files-found: error

      - name: Release IPA on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ios-release
          name: "Snake Puzzle iOS IPA (Sideloadly & AltStore)"
          body: |
            ## 📱 Snake Puzzle iOS IPA - Sideloadly & AltStore Ready
            
            Game Rắn Ăn Táo (Snake Puzzle: Slither to Eat) phiên bản dành cho iPhone / iPad.
            
            ### Hướng dẫn cài đặt vào iPhone bằng Sideloadly:
            1. Tải file **`SnakePuzzle.ipa`** đính kèm bên dưới.
            2. Kết nối iPhone với máy tính qua cáp USB (đảm bảo iTunes trên PC đã nhận diện iPhone).
            3. Mở phần mềm **Sideloadly**:
               - Kéo thả file `SnakePuzzle.ipa` vào khung bên trái của Sideloadly.
               - Nhập tài khoản **Apple ID** của bạn vào ô Apple ID.
               - Bấm nút **Start** và nhập mật khẩu Apple ID khi được yêu cầu (Sideloadly sẽ tự động ký chứng chỉ và cài game lên máy).
            4. Trên iPhone:
               - Mở **Cài đặt (Settings)** > **Cài đặt chung (General)** > **Quản lý VPN & Thiết bị (VPN & Device Management)**.
               - Chọn vào Apple ID của bạn và bấm **Tin cậy (Trust)**.
            5. Mở game và thưởng thức!
          files: SnakePuzzle.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
