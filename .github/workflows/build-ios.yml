name: Build iOS IPA (Sideloadly Ready)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build SnakePuzzle App
        run: |
          cd ios
          xcodebuild -project SnakePuzzle.xcodeproj \
            -scheme SnakePuzzle \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          echo "=== DERIVEDDATA PRODUCTS ==="
          ls -lh DerivedData/Build/Products/Release-iphoneos/
          ls -lh DerivedData/Build/Products/Release-iphoneos/SnakePuzzle.app/
          
          # Verify executable binary
          file DerivedData/Build/Products/Release-iphoneos/SnakePuzzle.app/SnakePuzzle

      - name: Package into IPA
        run: |
          cd ios
          mkdir -p Payload
          rm -rf Payload/*
          cp -r DerivedData/Build/Products/Release-iphoneos/SnakePuzzle.app Payload/
          
          # Copy resources if missing
          cp SnakePuzzle/App/Info.plist Payload/SnakePuzzle.app/Info.plist
          cp SnakePuzzle/Resources/levels.json Payload/SnakePuzzle.app/levels.json
          
          # Verify binary in Payload
          if [ ! -s "Payload/SnakePuzzle.app/SnakePuzzle" ]; then
            echo "FATAL: Mach-O binary missing from Payload!"
            exit 1
          fi
          
          zip -r -9 ../SnakePuzzle.ipa Payload
          cd ..
          ls -lh SnakePuzzle.ipa
          
          IPA_SIZE=$(wc -c < SnakePuzzle.ipa | tr -d ' ')
          echo "IPA Size: $IPA_SIZE bytes"
          if [ "$IPA_SIZE" -lt 50000 ]; then
            echo "FATAL: IPA file is suspiciously small ($IPA_SIZE bytes). Build failed!"
            exit 1
          fi
          
          echo "=== IPA CONTENTS ==="
          unzip -l SnakePuzzle.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakePuzzle-iOS-IPA
          path: SnakePuzzle.ipa
          if-no-files-found: error

      - name: Release IPA on GitHub
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete ios-v1.0 --cleanup-tag --yes || true
          gh release create ios-v1.0 SnakePuzzle.ipa \
            --title "Snake Puzzle iOS IPA (Sideloadly Ready)" \
            --notes "Tải file SnakePuzzle.ipa bên dưới để cài đặt lên iPhone / iPad thông qua Sideloadly hoặc AltStore trên máy tính."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
