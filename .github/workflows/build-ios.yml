name: Build iOS IPA (Sideloadly Ready)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build and Archive
        run: |
          cd ios
          xcodebuild -project SnakePuzzle.xcodeproj \
            -scheme SnakePuzzle \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive -archivePath build/SnakePuzzle.xcarchive

      - name: Package into IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/SnakePuzzle.xcarchive/Products/Applications/SnakePuzzle.app Payload/
          zip -r -9 ../SnakePuzzle.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakePuzzle-iOS-IPA
          path: SnakePuzzle.ipa
          if-no-files-found: error

      - name: Release IPA on GitHub
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ios-v1.0
          name: "Snake Puzzle iOS IPA"
          body: "Tải file SnakePuzzle.ipa bên dưới để cài đặt bằng Sideloadly hoặc AltStore trên máy tính."
          files: SnakePuzzle.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

