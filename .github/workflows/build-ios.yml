name: Build iOS IPA (Sideloadly Ready)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build SnakePuzzle App
        run: |
          cd ios
          xcodebuild -project SnakePuzzle.xcodeproj \
            -scheme SnakePuzzle \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            SYMROOT=build 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD FAILED - ERRORS ==="
              grep -C 3 "error:" xcodebuild.log || true
              tail -n 100 xcodebuild.log
              exit 1
            }
          
          echo "=== COMPILED FILES IN BUILD DIRECTORY ==="
          find build -type f
          
          if [ ! -f build/Release-iphoneos/SnakePuzzle.app/SnakePuzzle ]; then
            echo "Searching for SnakePuzzle executable..."
            EXE=$(find build -type f -name "SnakePuzzle" | head -n 1)
            if [ -n "$EXE" ]; then
              echo "Found executable at $EXE, placing inside app bundle"
              cp "$EXE" build/Release-iphoneos/SnakePuzzle.app/SnakePuzzle
              chmod +x build/Release-iphoneos/SnakePuzzle.app/SnakePuzzle
            fi
          fi

      - name: Package into IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/Release-iphoneos/SnakePuzzle.app Payload/
          zip -r -9 ../SnakePuzzle.ipa Payload
          cd ..
          ls -lh SnakePuzzle.ipa
          unzip -l SnakePuzzle.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakePuzzle-iOS-IPA
          path: SnakePuzzle.ipa
          if-no-files-found: error

      - name: Release IPA on GitHub
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ios-v1.0
          name: "Snake Puzzle iOS IPA"
          body: "Tải file SnakePuzzle.ipa bên dưới để cài đặt bằng Sideloadly hoặc AltStore trên máy tính."
          files: SnakePuzzle.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

